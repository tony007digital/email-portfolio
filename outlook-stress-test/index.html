<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Outlook Stress Test</title>
<meta name="description" content="Download an HTML email that isolates twelve documented Outlook rendering behaviours." />
<style>
  :root {
    --bg: #f7f7f5;
    --ink: #1a1a18;
    --muted: #5d5d57;
    --accent: #1a5f7a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16171a;
      --ink: #ececea;
      --muted: #a3a39c;
      --accent: #6fb3cd;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16171a;
    --ink: #ececea;
    --muted: #a3a39c;
    --accent: #6fb3cd;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }
  main { max-width: 440px; text-align: center; }
  h1 { font-size: 28px; line-height: 1.25; margin: 0 0 12px; letter-spacing: -0.02em; }
  p { color: var(--muted); margin: 0 0 28px; }
  a.btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    padding: 13px 28px;
    border-radius: 7px;
  }
  @media (max-width: 480px) {
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<main>
  <h1>Outlook stress test</h1>
  <p>One HTML email that isolates twelve Outlook rendering behaviours, one per block. Send it to yourself and open it in Outlook. A browser renders it correctly, so the browser tells you nothing.</p>
  <a class="btn" href="outlook-stress-test.html" download>Download the HTML</a>
</main>
</body>
</html>
